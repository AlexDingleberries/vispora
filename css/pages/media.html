    <style>
      .watch-time-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-top: 2px;
      }
      .watch-time-bar span.wt-val {
        color: var(--accent);
        font-weight: 700;
      }
      .ep-current-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.75rem;
        font-weight: 700;
        background: rgba(var(--accent-rgb), 0.12);
        border: 1px solid rgba(var(--accent-rgb), 0.25);
        color: var(--accent);
        padding: 3px 10px;
        border-radius: 100px;
        margin-bottom: 4px;
      }
      .subdub-picker {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
      }
      .subdub-btn {
        padding: 5px 14px;
        border-radius: var(--radius-sm);
        font-size: 0.78rem;
        font-weight: 700;
        border: 1px solid var(--card-border);
        background: var(--bg4);
        color: var(--text-secondary);
        cursor: pointer;
        transition: all 0.15s;
      }
      .subdub-btn.active {
        background: var(--accent);
        color: var(--text-inv);
        border-color: var(--accent);
        box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.25);
      }
      .subdub-btn:not(.active):hover {
        border-color: rgba(var(--accent-rgb), 0.4);
        color: var(--accent);
      }
      .subdub-label {
        font-size: 0.72rem;
        color: var(--text-secondary);
        font-weight: 600;
      }
      .related-section {
        margin-top: 32px;
      }
      .related-section .section-title {
        font-size: 1rem;
        font-weight: 700;
        margin-bottom: 14px;
      }
      .related-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 14px;
      }
      .related-card {
        position: relative;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid var(--card-border);
        background: var(--card-bg);
        transition: transform 0.18s, border-color 0.18s;
        cursor: pointer;
        text-decoration: none;
        display: block;
      }
      .related-card:hover {
        transform: translateY(-3px);
        border-color: rgba(var(--accent-rgb), 0.4);
      }
      .related-card img {
        width: 100%;
        aspect-ratio: 2/3;
        object-fit: cover;
        display: block;
      }
      .related-card-body {
        padding: 8px 10px;
      }
      .related-card-type {
        font-size: 0.64rem;
        font-weight: 700;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 2px;
      }
      .related-card-title {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text);
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .server-dropdown-wrap {
        position: relative;
      }
      .server-dropdown-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 13px;
        border-radius: var(--radius-sm);
        background: var(--bg4);
        border: 1px solid var(--card-border);
        color: var(--text-secondary);
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
        font-family: inherit;
        letter-spacing: 0.01em;
      }
      .server-dropdown-btn:hover {
        border-color: rgba(var(--accent-rgb), 0.45);
        color: var(--accent);
        background: rgba(var(--accent-rgb), 0.06);
      }
      .server-dropdown-btn.open {
        border-color: rgba(var(--accent-rgb), 0.55);
        color: var(--accent);
        background: rgba(var(--accent-rgb), 0.08);
      }
      .server-dropdown-btn svg {
        flex-shrink: 0;
        transition: transform 0.2s;
      }
      .server-dropdown-btn.open .srv-chev {
        transform: rotate(180deg);
      }
      .server-dropdown-menu {
        position: fixed;
        min-width: 200px;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        background: color-mix(in srgb, var(--bg2) 92%, transparent);
        border: 1px solid rgba(var(--accent-rgb), 0.18);
        border-radius: var(--radius);
        padding: 5px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4),
          0 0 0 1px rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(18px);
        opacity: 0;
        transform: translateY(8px) scale(0.97);
        pointer-events: none;
        transition: opacity 0.18s var(--ease), transform 0.18s var(--ease);
        z-index: 25000;
      }
      .server-dropdown-menu.open {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: all;
      }
      .server-dropdown-divider {
        height: 1px;
        background: rgba(var(--accent-rgb), 0.1);
        margin: 4px 6px;
      }
      .server-dropdown-header {
        padding: 6px 10px 4px;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-secondary);
        opacity: 0.7;
      }
      .server-option {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: calc(var(--radius) - 4px);
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        color: var(--text-secondary);
        transition: all 0.12s;
        user-select: none;
      }
      .server-option:hover {
        background: rgba(var(--accent-rgb), 0.09);
        color: var(--text);
      }
      .server-option.active {
        color: var(--accent);
        background: rgba(var(--accent-rgb), 0.08);
      }
      .server-option-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--card-border);
        transition: background 0.15s;
      }
      .server-option.active .server-option-dot {
        background: var(--accent);
        box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.6);
      }
      .server-option-name {
        flex: 1;
      }
      .server-option-check {
        opacity: 0;
        color: var(--accent);
        transition: opacity 0.15s;
      }
      .server-option.active .server-option-check {
        opacity: 1;
      }
    </style>
  </head>

    <script>
      document.getElementById("nav-ph").innerHTML = VApp.navHTML("");
      VCloak.initCloak();
      VApp.initPanic();
      VApp.initParticles();
      VApp.initNavChat();
      VApp.initNavProfile();
      VApp.initVersionCheck();
      const dtEl = document.getElementById("nav-datetime");
      if (dtEl) VApp.startDatetime(dtEl);
      const params = new URLSearchParams(location.search);
      const mediaType = params.get("type");
      const mediaId = params.get("id");
      const mediaKid = params.get("kid") ? Number(params.get("kid")) : null;
      if (!mediaType || !mediaId) {
        location.href = "home.html";
      }
      const DEFAULT_MOVIE_TEMPLATES = [
        {
          name: "Alpha",
          movie: "https://player.videasy.net/movie/{id}?color={color}",
        },
        { name: "Bravo", movie: "https://vidfast.pro/movie/{id}" },
        { name: "Charlie", movie: "https://peachify.top/embed/movie/{id}" },
        { name: "Delta", movie: "https://vidcore.net/movie/{id}" },
        { name: "Echo", movie: "https://vidplays.fun/embed/movie/{id}" },
        { name: "Golf", movie: "https://www.vidking.net/embed/movie/{id}" },
      ];
      const DEFAULT_TV_TEMPLATES = [
        {
          name: "Alpha",
          tv: "https://player.videasy.net/tv/{id}/{season}/{episode}?color={color}",
        },
        { name: "Bravo", tv: "https://vidfast.pro/tv/{id}/{season}/{episode}" },
        {
          name: "Charlie",
          tv: "https://peachify.top/embed/tv/{id}/{season}/{episode}",
        },
        { name: "Delta", tv: "https://vidcore.net/tv/{id}/{season}/{episode}" },
        {
          name: "Echo",
          tv: "https://vidplays.fun/embed/tv/{id}/{season}/{episode}",
        },
        {
          name: "Golf",
          tv: "https://www.vidking.net/embed/tv/{id}/{season}/{episode}",
        },
      ];
      const DEFAULT_ANIME_TEMPLATES = [
        {
          name: "Alpha",
          anime:
            "https://divine-dew-518d.alexdingleberries.workers.dev/stream/ani/{id}/{episode}/{dub}",
        },
        {
          name: "Bravo",
          anime: "https://anixo.buzz/embed/ani/{id}/{episode}/{dub}",
        },
        {
          name: "Charlie",
          anime: "https://vidnest.fun/animepahe/{id}/{episode}/{dub}",
        },
        {
          name: "Delta",
          anime: "https://vidnest.fun/anime/{id}/{episode}/{dub}",
        },
      ];
      function fillTemplate(tpl, vars) {
        const all = Object.assign({ color: VMedia.getAccentHex() }, vars);
        return tpl.replace(/\{(\w+)\}/g, (_, k) => all[k] ?? "");
      }
      function buildMovieServer(entry) {
        return {
          name: entry.name,
          movie: (id) => fillTemplate(entry.movie, { id }),
        };
      }
      function buildTvServer(entry) {
        return {
          name: entry.name,
          tv: (id, s, e) =>
            fillTemplate(entry.tv, { id, season: s, episode: e }),
        };
      }
      function mergeMovieTv(movieList, tvList) {
        return movieList.map((m) => {
          const t = tvList.find((x) => x.name === m.name);
          return {
            name: m.name,
            movie: buildMovieServer(m).movie,
            tv: t
              ? buildTvServer(t).tv
              : (id, s, e) => buildMovieServer(m).movie(id),
          };
        });
      }
      function buildAnimeServer(entry) {
        return {
          name: entry.name,
          url: (id, ep, dubbed) =>
            fillTemplate(entry.anime, {
              id,
              episode: ep,
              dub: dubbed ? "dub" : "sub",
            }),
        };
      }
      let MEDIA_SERVERS = mergeMovieTv(
        DEFAULT_MOVIE_TEMPLATES,
        DEFAULT_TV_TEMPLATES,
      );
      let ANIME_SERVERS = DEFAULT_ANIME_TEMPLATES.map(buildAnimeServer);
      let _linksConfigLoaded = false;
      async function loadServerConfig() {
        if (_linksConfigLoaded) return;
        _linksConfigLoaded = true;
        try {
          const cfg = await VMedia.getServerConfig();
          if (cfg) applyServerConfig(cfg);
        } catch (e) {
          console.warn(
            "[links-worker] fetch failed, using built-in defaults:",
            e,
          );
        }
      }
      function applyServerConfig(cfg) {
        if (cfg.movie?.length) {
          MEDIA_SERVERS = mergeMovieTv(
            cfg.movie,
            cfg.tv || DEFAULT_TV_TEMPLATES,
          );
          if (currentServerIdx >= MEDIA_SERVERS.length) currentServerIdx = 0;
        }
        if (cfg.anime?.length) {
          ANIME_SERVERS = cfg.anime.map(buildAnimeServer);
          if (currentAnimeServerIdx >= ANIME_SERVERS.length)
            currentAnimeServerIdx = 0;
        }
      }
      let currentServerIdx =
        parseInt(localStorage.getItem("vispora_media_server") || "0") || 0;
      if (currentServerIdx >= MEDIA_SERVERS.length) currentServerIdx = 0;
      let currentAnimeServerIdx =
        parseInt(localStorage.getItem("vispora_anime_server") || "0") || 0;
      if (currentAnimeServerIdx >= ANIME_SERVERS.length)
        currentAnimeServerIdx = 0;
      function getMovieUrl(id) {
        return MEDIA_SERVERS[currentServerIdx].movie(id);
      }
      function getTvUrl(id, season, episode) {
        return MEDIA_SERVERS[currentServerIdx].tv(id, season, episode);
      }
      function renderServerDropdown(type) {
        const wrap = document.getElementById("server-dropdown-wrap");
        const btn = document.getElementById("server-dropdown-btn");
        const menu = document.getElementById("server-dropdown-menu");
        const label = document.getElementById("server-dropdown-label");
        wrap.style.display = "";
        if (menu.parentElement !== document.body)
          document.body.appendChild(menu);
        const isAnime = type === "anime";
        const pool = isAnime ? ANIME_SERVERS : MEDIA_SERVERS;
        const activeIdx = isAnime ? currentAnimeServerIdx : currentServerIdx;
        label.textContent = pool[activeIdx].name;
        const existingOpts = menu.querySelectorAll(".server-option");
        existingOpts.forEach((o) => o.remove());
        pool.forEach((srv, i) => {
          const opt = document.createElement("div");
          opt.className =
            "server-option" +
            (i === (isAnime ? currentAnimeServerIdx : currentServerIdx)
              ? " active"
              : "");
          opt.setAttribute("role", "option");
          opt.setAttribute(
            "aria-selected",
            i === (isAnime ? currentAnimeServerIdx : currentServerIdx),
          );
          opt.dataset.idx = i;

            const active = list.querySelector(".episode-btn.active");
            if (active)
              active.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }, 100);
          loadEpisodeIntoFrame(showId, seasonNum, activeEp);
        } catch (e) {
          list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-secondary);font-size:0.8rem">Failed to load episodes</div>`;
        }
      }
      document.getElementById("episode-list").addEventListener("click", (e) => {
        const btn = e.target.closest(".episode-btn");
        if (!btn || !mediaData) return;
        if (mediaType === "tv") {
          loadEpisodeIntoFrame(
            mediaData.id,
            parseInt(btn.dataset.season),
            parseInt(btn.dataset.ep),
          );
        } else if (mediaType === "anime") {
          loadAnimeEpisodeIntoFrame(mediaData.id, parseInt(btn.dataset.ep));
        }
      });
      function loadAnimeEpisodeIntoFrame(animeId, episode) {
        const frame = document.getElementById("media-frame");
        currentEpisode = episode;
        VStorage.setAnimeProgress(animeId, episode);
        VStorage.addToMediaHistory(mediaData, "anime");
        resetEstFinish();
        setPlayerSrc(
          animePlayerUrlWithDub(mediaData?.anilistId || animeId, episode),
        );
        document.getElementById(
          "ep-current-display",
        ).innerHTML = `<div class="ep-current-badge">Episode ${episode}${
          isDubbed ? " · DUB" : " · SUB"
        }</div>`;
        const title = mediaData?.title || "Anime";
        document.title = `${title} — Ep ${episode} — vispora`;
        document.getElementById(
          "bc-title",
        ).textContent = `${title} — Ep ${episode}`;
        document.querySelectorAll(".episode-btn").forEach((b) => {
          b.classList.toggle("active", parseInt(b.dataset.ep) === episode);
        });
        const activeBtn = document.querySelector(
          `.episode-btn[data-ep="${episode}"]`,
        );
        if (activeBtn)
          activeBtn.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
      function buildAnimeEpisodePicker(animeId, totalEps, startEp) {
        if (!totalEps || totalEps < 1) return;
        const list = document.getElementById("episode-list");
        list.innerHTML = Array.from({ length: totalEps }, (_, i) => {
          const ep = i + 1;
          return `<button class="episode-btn${
            ep === startEp ? " active" : ""
          }" data-ep="${ep}" type="button">
      <span class="ep-number">E${ep}</span>
      <span class="ep-title">Episode ${ep}</span>
    </button>`;
        }).join("");
        setTimeout(() => {
          const active = list.querySelector(".episode-btn.active");
          if (active)
            active.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }, 100);
      }
      async function initMovie(id) {
        document.getElementById("bc-type").textContent = "Movies";
        document.getElementById("bc-type").href = "movies.html";
        const frame = document.getElementById("media-frame");
        const err = document.getElementById("player-error");
        const configPromise = loadServerConfig();
        try {
          mediaData = await VMedia.tmdbFetch(`/movie/${id}`, {
            append_to_response: "release_dates",
          });
          populateHero(mediaData, "movie");
          populateCast(id, "movie");
          loadRecs(id, "movie");
          VStorage.addToMediaHistory(mediaData, "movie");
          await configPromise;
          renderServerDropdown("movie");
          const url = getMovieUrl(id);
          setPlayerSrc(url);
          frame.onerror = () => {
            frame.style.display = "none";
            err.style.display = "flex";
            document.getElementById(
              "error-link",
            ).innerHTML = `<a href="${VApp.esc(
              url,
            )}" target="_blank" style="color:var(--accent)">Open directly ↗</a>`;
          };
        } catch (e) {
          console.error(e);
          VApp.showToast("Movie not found", "error");
          setTimeout(() => (location.href = "movies.html"), 1500);
        }
      }
      async function initTV(id) {
        document.getElementById("bc-type").textContent = "TV Shows";
        document.getElementById("bc-type").href = "tv.html";
        const configPromise = loadServerConfig();
        try {
          mediaData = await VMedia.tmdbFetch(`/tv/${id}`);
          populateHero(mediaData, "tv");
          populateCast(id, "tv");
          loadRecs(id, "tv");
          VStorage.addToMediaHistory(mediaData, "tv");
          await configPromise;
          renderServerDropdown("tv");
          const validSeasons = (mediaData.seasons || []).filter(
            (s) => s.season_number > 0,
          );
          const seasonSel = document.getElementById("season-select");
          seasonSel.style.display = "";
          validSeasons.forEach((s) => {
            const o = document.createElement("option");
            o.value = s.season_number;
            o.textContent = `Season ${s.season_number}`;
            seasonSel.appendChild(o);
          });
          const prog = VStorage.getTVProgress(id);
          const startSeason = prog.season || 1;
          const startEp = prog.episode || 1;
          seasonSel.value = startSeason;
          updateEpBadge(startSeason, startEp);
          document.getElementById("player-area").classList.add("tv-mode");
          document.getElementById("episode-picker").style.display = "";
          await loadSeasonEpisodes(id, startSeason, startEp);
          seasonSel.addEventListener("change", async () => {
            const s = parseInt(seasonSel.value);
            await loadSeasonEpisodes(id, s, 1);
          });
        } catch (e) {
          console.error(e);
          VApp.showToast("Show not found", "error");
          setTimeout(() => (location.href = "tv.html"), 1500);
        }
      }
      async function initAnime(id, kitsuId) {
        document.getElementById("bc-type").textContent = "Anime";
        document.getElementById("bc-type").href = "anime.html";
        const configPromise = loadServerConfig();
        try {
          const raw = await VMedia.getAnimeById(id, kitsuId);
          mediaData = {
            id: raw.id,
            kitsuId: raw.kitsuId || kitsuId || null,
            title: VMedia.animeTitle(raw),
            _cover: raw.coverImage?.large || raw.coverImage?.extraLarge || null,
            _backdrop: raw.bannerImage || raw.coverImage?.extraLarge || null,
          };
          const anilistPromise = VMedia.getAnilistIdForMal(id);
          populateAnimeHero(raw);
          await configPromise;
          renderServerDropdown("anime");
          populateCast(raw, "anime");
          loadRecs(raw, "anime");
          loadAnimeRelated(id, raw.kitsuId || kitsuId);
          VStorage.addToMediaHistory(mediaData, "anime");
          const prog = VStorage.getAnimeProgress(id);
          const startEp = prog.episode || 1;
          const totalEps = raw.episodes || 0;
          document.getElementById("player-area").classList.add("tv-mode");
          document.getElementById("episode-picker").style.display = "";
          document.getElementById("ep-picker-label").textContent = "Episodes";
          if (totalEps > 0) buildAnimeEpisodePicker(id, totalEps, startEp);
          else document.getElementById("episode-list").innerHTML = "";
          mediaData.anilistId = await anilistPromise;
          loadAnimeEpisodeIntoFrame(id, startEp);
        } catch (e) {
          console.error(e);
          VApp.showToast("Anime not found", "error");
          setTimeout(() => (location.href = "anime.html"), 1500);
        }
      }
      if (mediaType === "movie") initMovie(mediaId);
      else if (mediaType === "tv") initTV(mediaId);
      else if (mediaType === "anime") initAnime(mediaId, mediaKid);
      else location.href = "home.html";
      VTutorial.autoStart("media", {
        force: params.get("tour") === "1",
        ready: () => {
          const w = document.getElementById("server-dropdown-wrap");
          return w && w.style.display !== "none";
        },
      });
    </script>
  </body>
</html>
